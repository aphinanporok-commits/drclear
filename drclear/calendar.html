<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ปฏิทินนัดหมาย - Dr. Clear Aligner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <style>
    :root {
      --cal-border: #E8ECF0;
      --cal-head-bg: #F7F9FC;
      --cal-today: #1B6FA8;
      --cal-other: #C5CDD6;
      --chip-h: 22px;
    }

    body { background: #F4F7FA; }

    /* ===== Top bar ===== */
    .cal-topbar {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 24px; background: #fff;
      border-bottom: 1px solid var(--cal-border);
      position: sticky; top: 56px; z-index: 100;
    }
    .cal-month-label {
      font-size: 22px; font-weight: 800; color: var(--text);
      min-width: 200px;
    }
    .cal-nav-group { display: flex; gap: 4px; }
    .cal-nav-btn {
      width: 32px; height: 32px; border-radius: 6px;
      border: 1px solid var(--cal-border); background: #fff;
      cursor: pointer; font-size: 16px; display: flex;
      align-items: center; justify-content: center;
      color: var(--text); transition: background .15s;
    }
    .cal-nav-btn:hover { background: #F0F4F8; }
    .btn-today {
      padding: 6px 16px; border-radius: 8px; border: 1px solid var(--cal-border);
      background: #fff; font-family: var(--font); font-size: 13px;
      font-weight: 600; cursor: pointer; color: var(--text); transition: background .15s;
    }
    .btn-today:hover { background: #F0F4F8; }
    .btn-add-apt {
      margin-left: auto; padding: 8px 18px; border-radius: 8px;
      background: var(--primary); color: #fff; border: none;
      font-family: var(--font); font-size: 13px; font-weight: 700;
      cursor: pointer; transition: background .15s;
    }
    .btn-add-apt:hover { background: var(--primary-dark); }

    /* ===== Calendar Grid ===== */
    .cal-wrap { padding: 0; }

    .cal-weekdays {
      display: grid; grid-template-columns: repeat(7, 1fr);
      background: var(--cal-head-bg);
      border-bottom: 1px solid var(--cal-border);
    }
    .cal-wd {
      text-align: center; padding: 10px 8px;
      font-size: 12px; font-weight: 700; color: #8A9BAE;
      letter-spacing: .5px;
    }
    .cal-wd:first-child { color: #E74C3C; }
    .cal-wd:last-child { color: #2980B9; }

    .cal-grid {
      display: grid; grid-template-columns: repeat(7, 1fr);
      background: var(--cal-border);
      gap: 1px;
    }

    .cal-cell {
      background: #fff; min-height: 120px;
      padding: 8px 8px 6px;
      cursor: pointer; transition: background .12s;
      position: relative;
    }
    .cal-cell:hover { background: #F5F8FB; }
    .cal-cell.other-month { background: #FAFBFC; }
    .cal-cell.other-month .cell-num { color: var(--cal-other); }
    .cal-cell.is-today .cell-num-wrap .cell-num {
      background: var(--cal-today); color: #fff;
      border-radius: 50%; width: 26px; height: 26px;
      display: flex; align-items: center; justify-content: center;
    }
    .cal-cell.selected { background: #EBF5FF; }

    .cell-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
    .cell-num { font-size: 13px; font-weight: 700; color: var(--text); line-height: 1; }
    .cell-num-wrap { display: flex; align-items: center; }

    /* Sunday red, Saturday blue */
    .cal-cell:nth-child(7n+1) .cell-num { color: #E74C3C; }
    .cal-cell:nth-child(7n) .cell-num { color: #2980B9; }
    .cal-cell.other-month .cell-num { color: var(--cal-other) !important; }
    .cal-cell.is-today .cell-num { color: #fff !important; }

    .cell-add {
      width: 20px; height: 20px; border-radius: 4px; border: none;
      background: transparent; color: var(--text-muted); font-size: 16px;
      cursor: pointer; display: none; align-items: center; justify-content: center;
      line-height: 1;
    }
    .cal-cell:hover .cell-add { display: flex; }
    .cell-add:hover { background: $DCE8F0; color: var(--primary); }

    /* Chips */
    .cal-chips { display: flex; flex-direction: column; gap: 2px; }
    .apt-chip {
      height: var(--chip-h); border-radius: 4px; padding: 0 6px;
      font-size: 11px; font-weight: 600; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
      display: flex; align-items: center; gap: 4px;
      cursor: pointer; transition: opacity .15s;
    }
    .apt-chip:hover { opacity: .8; }
    .apt-chip-time { font-size: 10px; opacity: .75; flex-shrink: 0; }
    .apt-more {
      font-size: 11px; color: var(--text-muted); padding: 0 2px;
      cursor: pointer;
    }
    .apt-more:hover { color: var(--primary); }

    /* Procedure colours */
    .pc-aligner    { background:#D6EAF8; color:#1A5276; }
    .pc-whitening  { background:#FEF9E7; color:#7D6608; }
    .pc-filling    { background:#D5F5E3; color:#1E6B3B; }
    .pc-extraction { background:#FDEDEC; color:#A93226; }
    .pc-implant    { background:#F4ECF7; color:#6C3483; }
    .pc-scaling    { background:#EAF2FF; color:#154360; }
    .pc-denture    { background:#FDF2E9; color:#784212; }
    .pc-scan       { background:#E8F8F5; color:#0E6655; }
    .pc-checkup    { background:#EAFAF1; color:#186A3B; }
    .pc-other      { background:#F2F3F4; color:#424949; }

    /* ===== Day Panel (slide-in) ===== */
    .day-panel {
      position: fixed; right: 0; top: 56px; bottom: 0;
      width: 360px; background: #fff;
      border-left: 1px solid var(--cal-border);
      box-shadow: -4px 0 20px rgba(0,0,0,.08);
      transform: translateX(100%); transition: transform .25s ease;
      z-index: 200; display: flex; flex-direction: column;
    }
    .day-panel.open { transform: translateX(0); }
    .day-panel-head {
      padding: 16px 18px; border-bottom: 1px solid var(--cal-border);
      display: flex; align-items: center; justify-content: space-between;
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
      color: #fff;
    }
    .day-panel-title { font-size: 16px; font-weight: 700; }
    .day-panel-close {
      background: rgba(255,255,255,.2); border: none; color: #fff;
      width: 28px; height: 28px; border-radius: 50%;
      cursor: pointer; font-size: 18px; display: flex;
      align-items: center; justify-content: center;
    }
    .day-panel-close:hover { background: rgba(255,255,255,.35); }
    .day-panel-body { flex: 1; overflow-y: auto; padding: 14px; }
    .day-panel-foot {
      padding: 12px 14px; border-top: 1px solid var(--cal-border);
    }
    .btn-add-day {
      width: 100%; padding: 10px; border-radius: 8px;
      background: var(--primary); color: #fff; border: none;
      font-family: var(--font); font-size: 14px; font-weight: 700;
      cursor: pointer; transition: background .15s;
    }
    .btn-add-day:hover { background: var(--primary-dark); }

    /* Appointment item in panel */
    .apt-item {
      display: flex; gap: 10px; padding: 10px 12px;
      border-radius: 10px; border: 1px solid var(--cal-border);
      margin-bottom: 8px; cursor: pointer; transition: border-color .15s, background .15s;
    }
    .apt-item:hover { border-color: var(--primary); background: #F0F7FF; }
    .apt-time { font-size: 13px; font-weight: 700; color: var(--primary); min-width: 40px; }
    .apt-info { flex: 1; min-width: 0; }
    .apt-name { font-size: 14px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .apt-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .apt-status-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
    .dot-confirmed { background: #27AE60; }
    .dot-pending   { background: #F39C12; }
    .dot-done      { background: #2980B9; }
    .dot-cancelled { background: #E74C3C; }

    .panel-empty { text-align: center; padding: 32px 16px; color: var(--text-muted); font-size: 14px; }
    .panel-empty-icon { font-size: 36px; margin-bottom: 8px; }

    /* ===== Modal ===== */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.45); z-index: 500;
      align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: #fff; border-radius: 16px;
      width: 94%; max-width: 520px; max-height: 90vh;
      overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.25);
    }
    .modal-head {
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
      color: #fff; padding: 18px 22px; font-size: 17px; font-weight: 700;
      display: flex; align-items: center; justify-content: space-between;
      border-radius: 16px 16px 0 0;
    }
    .modal-close { background: none; border: none; color: #fff; font-size: 22px; cursor: pointer; }
    .modal-body { padding: 20px 22px; }
    .form-row { margin-bottom: 14px; }
    .form-label { display: block; font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 5px; }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 9px 12px; border: 1.5px solid var(--border);
      border-radius: 8px; font-family: var(--font); font-size: 14px;
      color: var(--text); background: #fff; box-sizing: border-box;
      transition: border-color .2s;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      outline: none; border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(27,111,168,.1);
    }
    .form-textarea { resize: vertical; min-height: 72px; }
    .form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .modal-foot { padding: 0 22px 20px; display: flex; gap: 8px; }
    .btn-save { background: var(--primary); color: #fff; border: none; padding: 10px 24px; border-radius: 8px; font-family: var(--font); font-size: 14px; font-weight: 700; cursor: pointer; flex: 1; }
    .btn-save:hover { background: var(--primary-dark); }
    .btn-cancel { background: #fff; color: var(--text-muted); border: 1.5px solid var(--border); padding: 10px 18px; border-radius: 8px; font-family: var(--font); font-size: 14px; cursor: pointer; }
    .btn-cancel:hover { background: #F5F8FA; }
    .btn-delete { background: #FDF2F2; color: var(--danger); border: 1.5px solid #FADBD8; padding: 10px 14px; border-radius: 8px; font-family: var(--font); font-size: 14px; cursor: pointer; }
    .btn-delete:hover { background: #FADBD8; }

    .form-input-wrap { position: relative; }
    .patient-suggest {
      position: absolute; z-index: 60; background: #fff;
      border: 1px solid var(--border); border-radius: 8px;
      box-shadow: var(--shadow); max-height: 160px; overflow-y: auto;
      width: 100%; top: 100%; left: 0;
    }
    .patient-suggest-item { padding: 8px 12px; cursor: pointer; font-size: 14px; }
    .patient-suggest-item:hover { background: #EBF5FF; }

    /* Toast */
    .toast-wrap { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
    .toast { padding: 12px 18px; border-radius: 10px; font-size: 14px; font-weight: 500; box-shadow: 0 4px 16px rgba(0,0,0,.2); animation: slideIn .3s ease; }
    .toast.success { background: #27AE60; color: #fff; }
    .toast.error   { background: #E74C3C; color: #fff; }
    .toast.info    { background: var(--primary); color: #fff; }
    @keyframes slideIn { from{transform:translateX(60px);opacity:0} to{transform:translateX(0);opacity:1} }

    /* Stats bar */
    .stats-bar {
      display: flex; gap: 0; background: #fff;
      border-bottom: 1px solid var(--cal-border);
      padding: 10px 24px; gap: 24px;
    }
    .stat-item { text-align: center; }
    .stat-num { font-size: 20px; font-weight: 800; color: var(--primary); }
    .stat-lbl { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
    .stat-sep { width: 1px; background: var(--cal-border); margin: 0 4px; }
  </style>
</head>

<!-- NAVBAR -->
<nav class="navbar">
  <a class="navbar-brand" href="index.html">
    <div class="navbar-logo">🦷</div>

<!-- Top bar -->

    <div class="stat-num" id="statToday">–</div>
    <div class="stat-lbl">นัดวันนี้</div>
  </div>
  <div class="stat-sep"></div>
  <div class="stat-item">
    <div class="stat-num" id="statWeek">–</div>
    <div class="stat-lbl">สัปดาห์นี้</div>
  </div>
  <div class="stat-sep"></div>
  <div class="stat-item">
    <div class="stat-num" id="statMonth">–</div>
    <div class="stat-lbl">เดือนนี้</div>
  </div>
  <div class="stat-sep"></div>
  <div class="stat-item">
    <div class="stat-num" id="statPending">–</div>
    <div class="stat-lbl">รอยืนยัน</div>
  </div>
</div>

<!-- Calendar -->
<div class="cal-wrap">
  <div class="cal-weekdays">
    <div class="cal-wd">อา</div>
    <div class="cal-wd">จ</div>
    <div class="cal-wd">อ</div>
    <div class="cal-wd">พ</div>
    <div class="cal-wd">พฤ</div>
    <div class="cal-wd">ศ</div>
    <div class="cal-wd">ส</div>
  </div>
  <div class="cal-grid" id="calGrid"></div>
</div>

<!-- Day Panel -->
<div class="day-panel" id="dayPanel">
  <div class="day-panel-head">
    <div class="day-panel-title" id="dayPanelTitle">วันที่</div>
    <button class="day-panel-close" onclick="closePanel()">×</button>
  </div>
  <div class="day-panel-body" id="dayPanelBody"></div>
  <div class="day-panel-foot">
    <button class="btn-add-day" id="btnAddDay" onclick="openModal(null)">+ เพิ่มนัดวันนี้</button>
  </div>
</div>

<!-- Modal -->

          <option value="checkup">🦷 ตรวจฟัน</option>

<script>
// ===== Config =====
const SUPABASE_URL = window.SUPABASE_CONFIG?.url || '';
const SUPABASE_KEY = window.SUPABASE_CONFIG?.anonKey || '';
const sb = (typeof supabase !== 'undefined') ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

const PROC_LABELS = {
  aligner:'จัดฟัน Clear Aligner', whitening:'ฟอกสีฟัน', filling:'อุดฟัน',
  extraction:'ถอนฟัน', implant:'รากฟันเทียม', scaling:'ขูดหินปูน',
  denture:'ทำฟันปลอม', scan:'แสกนฟัน (3D Scan)', checkup:'ตรวจฟัน', other:'อื่นๆ'
};
const PROC_CLASS = {
  aligner:'pc-aligner', whitening:'pc-whitening', filling:'pc-filling',
  extraction:'pc-extraction', implant:'pc-implant', scaling:'pc-scaling',
  denture:'pc-denture', scan:'pc-scan', checkup:'pc-checkup', other:'pc-other'
};
const STATUS_DOT = { confirmed:'dot-confirmed', pending:'dot-pending', done:'dot-done', cancelled:'dot-cancelled' };
const TH_MONTHS = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน',
  'กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];

let currentDate = new Date();
let allApts = [];
let patients = [];
let editingId = null;
let selectedDate = null;

// ===== Data =====
async function loadAll() {
  if (!sb) return;
  try {
    const { data, error } = await sb.from('appointments').select('*').order('date').order('time');
    if (error) throw error;
    allApts = data || [];
    renderCalendar();
    updateStats();
  } catch(err) {
    if (err.message.includes('schema cache') || err.message.includes('does not exist')) {
      toast('⚠️ ยังไม่มีตาราง appointments — กรุณารัน SQL ใน Supabase', 'error');
    } else {
      toast('โหลดข้อมูลไม่สำเร็จ: ' + err.message, 'error');
    }
  }
  // load patients
  try {
    const { data } = await sb.from('patients').select('id,name,phone').order('name');
    patients = data || [];
  } catch(_) {}
}

// ===== Stats =====
function updateStats() {
  const td = todayStr();
  const now = new Date();
  const weekStart = dateStr(new Date(now.getFullYear(), now.getMonth(), now.getDate() - now.getDay()));
  const weekEnd   = addDays(weekStart, 6);
  const mStart = dateStr(new Date(now.getFullYear(), now.getMonth(), 1));
  const mEnd   = dateStr(new Date(now.getFullYear(), now.getMonth()+1, 0));

  document.getElementById('statToday').textContent  = allApts.filter(a => a.date === td).length;
  document.getElementById('statWeek').textContent   = allApts.filter(a => a.date >= weekStart && a.date <= weekEnd).length;
  document.getElementById('statMonth').textContent  = allApts.filter(a => a.date >= mStart && a.date <= mEnd).length;
  document.getElementById('statPending').textContent= allApts.filter(a => a.status === 'pending').length;
}

// ===== Render Calendar =====
function renderCalendar() {
  const y = currentDate.getFullYear();
  const m = currentDate.getMonth();
  document.getElementById('monthLabel').textContent = TH_MONTHS[m] + ' ' + (y + 543);

  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';

  const firstDay = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const daysInPrev  = new Date(y, m, 0).getDate();
  const today = todayStr();

  // Build apt map
  const aptMap = {};
  allApts.forEach(a => {
    if (!aptMap[a.date]) aptMap[a.date] = [];
    aptMap[a.date].push(a);
  });

  // Total cells: 6 rows × 7 = 42
  for (let i = 0; i < 42; i++) {
    const cell = document.createElement('div');
    cell.className = 'cal-cell';

    let ds, isOther = false;
    if (i < firstDay) {
      const d = daysInPrev - firstDay + i + 1;
      ds = dateStr(new Date(y, m-1, d));
      isOther = true;
    } else if (i - firstDay < daysInMonth) {
      const d = i - firstDay + 1;
      ds = dateStr(new Date(y, m, d));
    } else {
      const d = i - firstDay - daysInMonth + 1;
      ds = dateStr(new Date(y, m+1, d));
      isOther = true;
    }

    if (isOther) cell.classList.add('other-month');
    if (ds === today) cell.classList.add('is-today');
    if (ds === selectedDate) cell.classList.add('selected');

    const dayNum = parseInt(ds.split('-')[2]);
    cell.innerHTML = `
      <div class="cell-top">
        <div class="cell-num-wrap"><div class="cell-num">${dayNum}</div></div>
        <button class="cell-add" onclick="event.stopPropagation();openModal('${ds}')">+</button>
      </div>
      <div class="cal-chips" id="chips-${ds}"></div>`;

    cell.onclick = () => openDayPanel(ds);
    grid.appendChild(cell);

    // Render chips
    const apts = (aptMap[ds] || []).sort((a,b) => a.time.localeCompare(b.time));
    const chipsEl = cell.querySelector('.cal-chips');
    const max = 3;
    apts.slice(0, max).forEach(apt => {
      const chip = document.createElement('div');
      chip.className = 'apt-chip ' + (PROC_CLASS[apt.procedure_type] || 'pc-other');
      const t = apt.time ? apt.time.slice(0,5) : '';
      chip.innerHTML = `<span class="apt-chip-time">${t}</span>${apt.patient_name}`;
      chip.title = apt.patient_name + ' · ' + (PROC_LABELS[apt.procedure_type]||'') + ' · ' + t;
      chip.onclick = (e) => { e.stopPropagation(); openModal(ds, apt); };
      chipsEl.appendChild(chip);
    });
    if (apts.length > max) {
      const more = document.createElement('div');
      more.className = 'apt-more';
      more.textContent = `+${apts.length - max} more`;
      more.onclick = (e) => { e.stopPropagation(); openDayPanel(ds); };
      chipsEl.appendChild(more);
    }
  }
}

// ===== Day Panel =====
function openDayPanel(ds) {
  selectedDate = ds;
  renderCalendar();

  const panel = document.getElementById('dayPanel');
  const body  = document.getElementById('dayPanelBody');
  const title = document.getElementById('dayPanelTitle');
  const btnAdd = document.getElementById('btnAddDay');

  // Format date Thai
  const d = new Date(ds + 'T00:00:00');
  const dayNames = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
  title.textContent = `${dayNames[d.getDay()]} ${d.getDate()} ${TH_MONTHS[d.getMonth()]} ${d.getFullYear()+543}`;
  btnAdd.onclick = () => openModal(ds);

  const apts = allApts.filter(a => a.date === ds).sort((a,b) => a.time.localeCompare(b.time));
  if (!apts.length) {
    body.innerHTML = `<div class="panel-empty"><div class="panel-empty-icon">📅</div>ไม่มีนัดหมายวันนี้</div>`;
  } else {
    body.innerHTML = apts.map(apt => `
      <div class="apt-item" onclick="openModal('${ds}', ${JSON.stringify(apt).replace(/"/g,'&quot;')})">
        <div class="apt-time">${apt.time ? apt.time.slice(0,5) : '--:--'}</div>
        <div class="apt-info">
          <div class="apt-name">${apt.patient_name}</div>
          <div class="apt-sub">${PROC_LABELS[apt.procedure_type]||apt.procedure_type}${apt.price ? ' · ฿'+Number(apt.price).toLocaleString() : ''}</div>
        </div>
        <div class="apt-status-dot ${STATUS_DOT[apt.status]||'dot-pending'}"></div>
      </div>`).join('');
  }

  panel.classList.add('open');
}

function closePanel() {
  document.getElementById('dayPanel').classList.remove('open');
  selectedDate = null;
  renderCalendar();
}

// ===== Modal =====
function openModal(ds, apt) {
  editingId = apt ? apt.id : null;
  document.getElementById('modalTitle').textContent = apt ? 'แก้ไขนัดหมาย' : 'เพิ่มนัดหมาย';
  document.getElementById('btnDelete').style.display = apt ? 'block' : 'none';
  document.getElementById('fId').value = '';
  document.getElementById('fPatient').value = apt ? apt.patient_name : '';
  document.getElementById('fPatientId').value = apt ? (apt.patient_id||'') : '';
  document.getElementById('fDate').value = apt ? apt.date : (ds || todayStr());
  document.getElementById('fTime').value = apt ? (apt.time||'').slice(0,5) : '09:00';
  document.getElementById('fProc').value = apt ? apt.procedure_type : 'checkup';
  document.getElementById('fStatus').value = apt ? apt.status : 'pending';
  document.getElementById('fPhone').value = apt ? (apt.phone||'') : '';
  document.getElementById('fPrice').value = apt ? (apt.price||'') : '';
  document.getElementById('fNotes').value = apt ? (apt.notes||'') : '';
  document.getElementById('patientSuggest').style.display = 'none';
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  editingId = null;
}

async function saveApt() {
  const name = document.getElementById('fPatient').value.trim();
  const date = document.getElementById('fDate').value;
  const time = document.getElementById('fTime').value;
  if (!name || !date || !time) { toast('กรุณากรอกข้อมูลให้ครบ', 'error'); return; }
  const proc = document.getElementById('fProc').value;
  const payload = {
    patient_name: name,
    patient_id: document.getElementById('fPatientId').value || null,
    date, time: time + ':00',
    procedure_type: proc,
    status: document.getElementById('fStatus').value,
    phone: document.getElementById('fPhone').value.trim() || null,
    notes: document.getElementById('fNotes').value.trim() || null,
    price: parseFloat(document.getElementById('fPrice').value) || null,
  };
  try {
    if (editingId) {
      await sb.from('appointments').update(payload).eq('id', editingId);
      toast('แก้ไขนัดหมายเรียบร้อย ✅', 'success');
    } else {
      await sb.from('appointments').insert([payload]);
      toast('เพิ่มนัดหมายเรียบร้อย ✅', 'success');
    }
    closeModal();
    await loadAll();
    if (selectedDate) openDayPanel(selectedDate);
  } catch(err) {
    toast('บันทึกไม่สำเร็จ: ' + err.message, 'error');
  }
}

async function deleteApt() {
  if (!editingId) return;
  if (!confirm('ต้องการลบนัดหมายนี้?')) return;
  try {
    await sb.from('appointments').delete().eq('id', editingId);
    toast('ลบนัดหมายแล้ว', 'info');
    closeModal();
    await loadAll();
    if (selectedDate) openDayPanel(selectedDate);
  } catch(err) {
    toast('ลบไม่สำเร็จ: ' + err.message, 'error');
  }
}

// ===== Patient autocomplete =====
function searchPatients(q) {
  const box = document.getElementById('patientSuggest');
  document.getElementById('fPatientId').value = '';
  if (!q || q.length < 1) { box.style.display = 'none'; return; }
  const filtered = patients.filter(p =>
    p.name.toLowerCase().includes(q.toLowerCase()) || (p.phone||'').includes(q)
  ).slice(0, 8);
  if (!filtered.length) { box.style.display = 'none'; return; }
  box.innerHTML = filtered.map(p => `
    <div class="patient-suggest-item" onclick="selectPatient('${p.id}','${p.name.replace(/'/g,"\\'")}','${(p.phone||'').replace(/'/g,"\\'")}')">
      👤 ${p.name}${p.phone ? ' · ' + p.phone : ''}
    </div>`).join('');
  box.style.display = 'block';
}

function selectPatient(id, name, phone) {
  document.getElementById('fPatient').value = name;
  document.getElementById('fPatientId').value = id;
  if (phone && !document.getElementById('fPhone').value) document.getElementById('fPhone').value = phone;
  document.getElementById('patientSuggest').style.display = 'none';
}

document.addEventListener('click', e => {
  if (!e.target.closest('.form-input-wrap'))
    document.getElementById('patientSuggest').style.display = 'none';
});

// ===== Nav =====
function prevMonth() { currentDate.setMonth(currentDate.getMonth() - 1); renderCalendar(); }
function nextMonth() { currentDate.setMonth(currentDate.getMonth() + 1); renderCalendar(); }
function goToday()   { currentDate = new Date(); selectedDate = todayStr(); renderCalendar(); openDayPanel(todayStr()); }

// ===== Helpers =====
function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function dateStr(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function addDays(ds, n) {
  const d = new Date(ds + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return dateStr(d);
}
function toast(msg, type='info') {
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

loadAll();
</script>
